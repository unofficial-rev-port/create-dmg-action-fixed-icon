name: 'build-test'
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: mkdir test.app
      - uses: ./
        with:
          name: test
          srcdir: ./test.app
      - uses: actions/upload-artifact@v7
        with:
          name: test
          path: ./test.dmg
      - run: sudo hdiutil attach ./test.dmg
